description: >
  La famosa rueda de lectura de Ramelli permite al erudito mantener múltiples libros 
  abiertos simultáneamente. A diferencia de una rueda de la fortuna simple, utiliza 
  un tren de engranajes epicicloidal oculto para garantizar que los atriles se mantengan 
  estrictamente horizontales independientemente de la rotación del tambor principal.
