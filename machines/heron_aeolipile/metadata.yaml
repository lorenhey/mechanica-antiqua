description: >
  Conocida como la primera máquina de vapor, la eolípila consiste en una esfera hueca montada 
  sobre un eje soportado por un caldero. El vapor asciende por los soportes hacia la esfera y escapa 
  a través de dos toberas acodadas, generando empuje por reacción. Nunca fue usada como fuerza motriz.
