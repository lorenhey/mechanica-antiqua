reconstruction_status: Nivel C (Paramétrica fuerte / principios físicos comprobados)
confidence: Principio físico certero, dimensiones completamente supuestas.
license: Dominio Público
description: Conocida como la primera máquina de vapor, la eolípila consiste en una
  esfera hueca montada sobre un eje soportado por un caldero. El vapor asciende por
  los soportes hacia la esfera y escapa a través de dos toberas acodadas tangenciales,
  generando empuje por reacción. Nunca fue usada como fuerza motriz.
display_year: 50 d.C.
period: Antigüedad clásica
region: Egipto romano (Alejandría)
would_it_actually_work: Sí, gira a miles de revoluciones por minuto como demostrador
  termodinámico.
