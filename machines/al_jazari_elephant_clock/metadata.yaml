description: Monumental autómata y reloj hidráulico con forma de elefante asiático.
  En su interior, un cuenco perforado flota en un depósito y se sumerge a tasa constante;
  al hundirse, activa un sistema de poleas, balancines y levas que liberan esferas
  metálicas, hacen sonar un platillo y mueven autómatas mecánicos cada media hora.
