description: "Considered one of the earliest programmable machines. It consists of a large mechanical flute player. Water flow drives a waterwheel, turning a large drum with pins on it. The pins trip levers that close and open the holes of a flute. A continuous air supply is generated by two alternating water vessels that compress air into the flute."
