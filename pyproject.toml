[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanica-antiqua"
version = "1.0.0"
authors = [
  { name="Mechanica Antiqua Contributors" },
]
description = "Historical machines reconstructed with modern engineering."
readme = "README.md"
license = { text = "CC0-1.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "jinja2>=3.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black"
]

[tool.setuptools.packages.find]
include = ["mechanica", "web"]
