description: >
  Una máquina para elevar agua inventada (o popularizada) por Arquímedes. Vitruvio da instrucciones 
  extremadamente precisas para su construcción geométrica basada en una grilla de proporciones de 8 
  partes para el núcleo y el paso de la hélice, estableciendo también un ángulo de inclinación 
  específico (triángulo pitagórico 3-4-5, es decir, ~37 grados).
