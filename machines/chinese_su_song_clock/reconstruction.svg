<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ss-bg { fill: #fcf9f2; }
      .ss-wood { fill: #8b5a2b; stroke: #5c3a1e; stroke-width: 2.5; }
      .ss-iron { fill: #444; stroke: #222; stroke-width: 2; }
      .ss-water { fill: #4a90e2; fill-opacity: 0.7; }
      .ss-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .ss-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
      
      @keyframes anim-wheel-step {
        0%, 75% { transform: rotate(0deg); }
        85% { transform: rotate(22.5deg); }
        100% { transform: rotate(22.5deg); }
      }
      @keyframes anim-armillary-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes anim-bucket-fill {
        0% { height: 5px; y: 220px; }
        75% { height: 28px; y: 197px; }
        85% { height: 5px; y: 220px; }
        100% { height: 5px; y: 220px; }
      }
      @keyframes anim-water-drip {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -20; }
      }
      
      .escapement-wheel {
        transform-origin: 400px 330px;
        animation: anim-wheel-step 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .armillary-rot {
        transform-origin: 400px 120px;
        animation: anim-armillary-spin 20s linear infinite;
      }
      .filling-water {
        animation: anim-bucket-fill 4s linear infinite;
      }
      .drip-flow {
        stroke-dasharray: 6 4;
        animation: anim-water-drip 0.8s linear infinite;
      }
    </style>
  </defs>

  <rect width="800" height="600" class="ss-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="ss-title">Torre del Reloj Astronómico de Su Song (1092)</text>
  <text x="400" y="70" text-anchor="middle" class="ss-text">Mecanismo de escape hidráulico con báscula de clepsidra (Shui Yun Yi Xiang Tai)</text>

  <!-- Esfera armilar superior giratoria (en el techo de la torre) -->
  <g class="armillary-rot">
    <circle cx="400" cy="120" r="50" fill="none" stroke="#c59b27" stroke-width="4"/>
    <ellipse cx="400" cy="120" rx="50" ry="20" fill="none" stroke="#c59b27" stroke-width="3"/>
    <ellipse cx="400" cy="120" rx="20" ry="50" fill="none" stroke="#c59b27" stroke-width="3"/>
    <circle cx="400" cy="120" r="10" fill="#dc2626"/>
  </g>
  <text x="400" y="185" text-anchor="middle" class="ss-text" font-weight="bold">Esfera Armilar de Observación</text>

  <!-- Canal de agua superior de nivel constante -->
  <rect x="180" y="160" width="160" height="20" class="ss-wood"/>
  <path d="M 330 180 L 330 220" stroke="#4a90e2" stroke-width="6" class="drip-flow"/>
  <text x="260" y="150" class="ss-text">Caudal constante</text>

  <!-- RUEDA HIDRÁULICA CON ESCAPE PASO A PASO (Animada) -->
  <g class="escapement-wheel">
    <circle cx="400" cy="330" r="130" fill="none" stroke="#8b5a2b" stroke-width="12"/>
    <circle cx="400" cy="330" r="28" class="ss-wood"/>
    
    <!-- Rayos -->
    <line x1="400" y1="200" x2="400" y2="460" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="270" y1="330" x2="530" y2="330" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="308" y1="238" x2="492" y2="422" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="308" y1="422" x2="492" y2="238" stroke="#5c3a1e" stroke-width="5"/>
    
    <!-- 8 Cangilones basculantes en la periferia -->
    <rect x="385" y="195" width="30" height="30" class="ss-wood"/>
    <rect x="385" y="435" width="30" height="30" class="ss-wood"/>
    <rect x="265" y="315" width="30" height="30" class="ss-wood"/>
    <rect x="505" y="315" width="30" height="30" class="ss-wood"/>
    <rect x="300" y="230" width="30" height="30" class="ss-wood"/>
    <rect x="470" y="400" width="30" height="30" class="ss-wood"/>
    <rect x="300" y="400" width="30" height="30" class="ss-wood"/>
    <rect x="470" y="230" width="30" height="30" class="ss-wood"/>
  </g>

  <!-- Agua acumulándose en el cangilón superior hasta vencer el contrapeso -->
  <rect x="388" y="200" width="24" height="20" class="ss-water filling-water"/>

  <!-- Trinquete y báscula de escape de Su Song (lado superior izquierdo) -->
  <polygon points="340,210 375,200 375,215" fill="#333"/>
  <line x1="310" y1="220" x2="350" y2="220" stroke="#c59b27" stroke-width="5"/>
  <circle cx="350" cy="220" r="5" fill="#222"/>
  <text x="290" y="245" class="ss-text" font-weight="bold">Trinquete de escape</text>

  <!-- Panel explicativo -->
  <rect x="40" y="470" width="320" height="95" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="495" class="ss-text" font-weight="bold">Escape Hidráulico (Escapement Step):</text>
  <text x="50" y="515" class="ss-text">• El agua llena el cangilón superior lentamente.</text>
  <text x="50" y="535" class="ss-text">• Al alcanzar la masa crítica (10 kg), vence la báscula.</text>
  <text x="50" y="552" class="ss-text">• La rueda avanza exactamente un paso angular.</text>
</svg>
