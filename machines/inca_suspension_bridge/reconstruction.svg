<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ib-bg { fill: #fcf9f2; }
      .ib-cliff { fill: #8c7853; stroke: #4a3b22; stroke-width: 3; }
      .ib-rope { stroke: #d97706; stroke-width: 6; fill: none; }
      .ib-water { fill: #4a90e2; fill-opacity: 0.7; }
      .ib-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .ib-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
    </style>
  </defs>

  <rect width="800" height="600" class="ib-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="ib-title">Puente Colgante de Q'eswachaka (Qhapaq Ñan)</text>
  <text x="400" y="70" text-anchor="middle" class="ib-text">Ingeniería vial incaica - Catenaria de fibra vegetal trenzada (ichu/q'oya) sobre el río Apurímac</text>

  <!-- Cañón rocoso del río Apurímac (acantilados a ambos lados) -->
  <!-- Risco izquierdo -->
  <path d="M 0 180 L 160 180 L 180 230 L 140 380 L 190 520 L 0 520 Z" class="ib-cliff"/>
  <!-- Estribo ciclópeo inca de piedra almohadillada -->
  <rect x="110" y="180" width="60" height="70" fill="#a89a84" stroke="#5c4e3e" stroke-width="2"/>
  <line x1="110" y1="205" x2="170" y2="205" stroke="#333" stroke-width="1.5"/>
  <line x1="110" y1="230" x2="170" y2="230" stroke="#333" stroke-width="1.5"/>
  <text x="140" y="165" text-anchor="middle" class="ib-text" font-weight="bold">Estribo en roca viva</text>

  <!-- Risco derecho -->
  <path d="M 800 180 L 640 180 L 620 230 L 660 380 L 610 520 L 800 520 Z" class="ib-cliff"/>
  <rect x="630" y="180" width="60" height="70" fill="#a89a84" stroke="#5c4e3e" stroke-width="2"/>
  <line x1="630" y1="205" x2="690" y2="205" stroke="#333" stroke-width="1.5"/>
  <line x1="630" y1="230" x2="690" y2="230" stroke="#333" stroke-width="1.5"/>
  <text x="660" y="165" text-anchor="middle" class="ib-text" font-weight="bold">Estribo en roca viva</text>

  <!-- Río Apurímac en el fondo del cañón -->
  <rect x="0" y="520" width="800" height="80" class="ib-water"/>
  <text x="400" y="565" text-anchor="middle" fill="#fff" font-family="'Cinzel', serif" font-weight="bold" font-size="16">Río Apurímac (Garganta profunda)</text>

  <!-- CURVA CATENARIA EXACTA DE LOS CABLES MAESTROS (y = a * cosh(x/a)) -->
  <!-- Cables portantes principales inferiores (suelo del puente) -->
  <path d="M 160 210 Q 400 350 640 210" class="ib-rope" stroke-width="8"/>
  <path d="M 160 216 Q 400 356 640 216" class="ib-rope" stroke-width="6" stroke="#b45309"/>

  <!-- Cables pasamanos superiores (barandillas) -->
  <path d="M 160 185 Q 400 290 640 185" class="ib-rope" stroke-width="5" stroke="#f59e0b"/>

  <!-- Péndolas y tejidos laterales de amarre (red de sujeción vertical) -->
  <!-- Celosía de ramas trenzadas cada 30 px -->
  <line x1="200" y1="195" x2="200" y2="225" stroke="#b45309" stroke-width="2"/>
  <line x1="240" y1="210" x2="240" y2="248" stroke="#b45309" stroke-width="2"/>
  <line x1="280" y1="225" x2="280" y2="272" stroke="#b45309" stroke-width="2"/>
  <line x1="320" y1="240" x2="320" y2="295" stroke="#b45309" stroke-width="2"/>
  <line x1="360" y1="250" x2="360" y2="315" stroke="#b45309" stroke-width="2"/>
  <line x1="400" y1="255" x2="400" y2="322" stroke="#b45309" stroke-width="2.5"/>
  <line x1="440" y1="250" x2="440" y2="315" stroke="#b45309" stroke-width="2"/>
  <line x1="480" y1="240" x2="480" y2="295" stroke="#b45309" stroke-width="2"/>
  <line x1="520" y1="225" x2="520" y2="272" stroke="#b45309" stroke-width="2"/>
  <line x1="560" y1="210" x2="560" y2="248" stroke="#b45309" stroke-width="2"/>
  <line x1="600" y1="195" x2="600" y2="225" stroke="#b45309" stroke-width="2"/>

  <!-- Flecha máxima en el centro (Sag f ≈ 3,5 m) -->
  <line x1="400" y1="210" x2="400" y2="322" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="415" y="285" fill="#ef4444" font-weight="bold" font-size="12">Flecha f</text>

  <!-- Panel analítico de catenarias -->
  <rect x="250" y="90" width="300" height="85" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="260" y="112" class="ib-text" font-weight="bold">Estática de Cables Catenarios:</text>
  <text x="260" y="130" class="ib-text">• Luz libre L = 28,5 m | Flecha f = 3,5 m</text>
  <text x="260" y="148" class="ib-text">• Tensión máx. T_max = H / cos(θ_apoyo)</text>
  <text x="260" y="165" class="ib-text">• Resistencia del ichu trenzado: σ_adm ≈ 15 MPa</text>
</svg>
