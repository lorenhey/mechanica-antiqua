description: Reloj hidráulico de alta precisión para el mundo antiguo. Incorpora una
  válvula de flotador de nivel constante que estabiliza la presión hidrostática y
  garantiza un caudal volumétrico uniforme a través de un orificio de piedras duras.
  El nivel ascendente eleva un flotador acoplado a una cremallera y piñón que desplaza
  el indicador horario.
