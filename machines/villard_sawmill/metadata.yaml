description: Uno de los primeros esquemas europeos de un aserradero mecanizado. El eje de la rueda hidráulica está provisto de levas que empujan la sierra hacia abajo, mientras que una vara elástica (pértiga) en la parte superior provee la fuerza de retorno. Además, un mecanismo acoplado avanza el tronco automáticamente.
