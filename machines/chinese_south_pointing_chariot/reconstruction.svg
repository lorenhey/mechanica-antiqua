<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sc-bg { fill: #fcf9f2; }
      .sc-wood { fill: #8b5a2b; stroke: #5c3a1e; stroke-width: 2.5; }
      .sc-bronze { fill: #c59b27; stroke: #7a5a10; stroke-width: 2; }
      .sc-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .sc-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
      
      @keyframes anim-wheel-left {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes anim-wheel-right {
        from { transform: rotate(0deg); }
        to { transform: rotate(180deg); }
      }
      @keyframes anim-diff-spider {
        from { transform: rotate(0deg); }
        to { transform: rotate(90deg); }
      }
      @keyframes anim-pointer-stay {
        0%, 100% { transform: rotate(0deg); }
      }
      
      .wheel-l {
        transform-origin: 260px 420px;
        animation: anim-wheel-left 4s linear infinite;
      }
      .wheel-r {
        transform-origin: 540px 420px;
        animation: anim-wheel-right 4s linear infinite;
      }
      .diff-center {
        transform-origin: 400px 320px;
        animation: anim-diff-spider 4s linear infinite;
      }
    </style>
  </defs>

  <rect width="800" height="600" class="sc-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="sc-title">Carro Apuntador Hacia el Sur (Zhinanche)</text>
  <text x="400" y="70" text-anchor="middle" class="sc-text">Ma Jun (c. 255 d.C.) / Yan Su (1027) - Mecanismo diferencial mecánico que compensa el viraje</text>

  <!-- Chasis del carro de dos ruedas -->
  <rect x="220" y="380" width="360" height="40" class="sc-wood"/>

  <!-- Rueda Izquierda (Gira más rápido, como en curva hacia la derecha) -->
  <g class="wheel-l">
    <circle cx="260" cy="420" r="75" fill="none" stroke="#8b5a2b" stroke-width="12"/>
    <circle cx="260" cy="420" r="18" fill="#333"/>
    <line x1="260" y1="345" x2="260" y2="495" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="185" y1="420" x2="335" y2="420" stroke="#5c3a1e" stroke-width="5"/>
  </g>
  <text x="260" y="525" text-anchor="middle" class="sc-text">Rueda exterior (ω₁)</text>

  <!-- Rueda Derecha (Gira más lento) -->
  <g class="wheel-r">
    <circle cx="540" cy="420" r="75" fill="none" stroke="#8b5a2b" stroke-width="12"/>
    <circle cx="540" cy="420" r="18" fill="#333"/>
    <line x1="540" y1="345" x2="540" y2="495" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="465" y1="420" x2="615" y2="420" stroke="#5c3a1e" stroke-width="5"/>
  </g>
  <text x="540" y="525" text-anchor="middle" class="sc-text">Rueda interior (ω₂)</text>

  <!-- ENGRANAJES DIFERENCIALES CENTRALES (Animados) -->
  <rect x="330" y="270" width="140" height="110" fill="#fff" stroke="#7a5a10" stroke-width="2" rx="6"/>
  <text x="400" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10">Tren Diferencial</text>

  <g class="diff-center">
    <circle cx="400" cy="330" r="32" class="sc-bronze"/>
    <circle cx="400" cy="330" r="8" fill="#222"/>
    <line x1="400" y1="298" x2="400" y2="362" stroke="#fff" stroke-width="3"/>
    <line x1="368" y1="330" x2="432" y2="330" stroke="#fff" stroke-width="3"/>
  </g>

  <!-- Columna vertical que sostiene al sabio apuntador -->
  <rect x="390" y="160" width="20" height="110" class="sc-wood"/>

  <!-- FIGURA DEL SABIO QUE APUNTA SIEMPRE AL SUR (Orientación absoluta invariable) -->
  <g transform="translate(400, 160)">
    <!-- Cuerpo del sabio de madera -->
    <rect x="-16" y="-55" width="32" height="55" rx="4" class="sc-wood"/>
    <!-- Cabeza -->
    <circle cx="0" cy="-70" r="15" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <!-- Brazo extendido apuntando fijamente hacia el Sur (izquierda en la proyección) -->
    <line x1="-10" y1="-50" x2="-65" y2="-50" stroke="#b45309" stroke-width="6"/>
    <!-- Mano que señala -->
    <polygon points="-65,-54 -78,-50 -65,-46" fill="#b45309"/>
    <text x="-90" y="-45" font-size="13" font-weight="bold" fill="#ef4444">SUR</text>
  </g>

  <!-- Panel cinemático -->
  <rect x="40" y="100" width="250" height="95" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="125" class="sc-text" font-weight="bold">Cinemática Diferencial:</text>
  <text x="50" y="145" class="sc-text">• Δω = ω_izq - ω_der (giro del chasis)</text>
  <text x="50" y="165" class="sc-text">• El engranaje resta exactamente Δθ</text>
  <text x="50" y="182" class="sc-text">• Orientación del puntero: θ_sur = const</text>
</svg>
