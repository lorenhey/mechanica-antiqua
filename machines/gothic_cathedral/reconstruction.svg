<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .gc-bg { fill: #fcf9f2; }
      .gc-stone { fill: #e5dfd5; stroke: #5c4e3e; stroke-width: 2.5; }
      .gc-thrust { stroke: #ef4444; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; }
      .gc-arrow { fill: #ef4444; }
      .gc-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .gc-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
    </style>
  </defs>

  <rect width="800" height="600" class="gc-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="gc-title">Estructura Estática de la Catedral Gótica</text>
  <text x="400" y="70" text-anchor="middle" class="gc-text">Villard de Honnecourt / Maestros Canteros (c. 1200) - Desvío de empujes laterales por arbotantes</text>

  <!-- Terreno / Cimentación -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#5c4e3e" stroke-width="4"/>

  <!-- NAVE CENTRAL -->
  <!-- Pilares de la nave central -->
  <rect x="340" y="260" width="25" height="260" class="gc-stone"/>
  <rect x="435" y="260" width="25" height="260" class="gc-stone"/>
  <text x="400" y="500" text-anchor="middle" class="gc-text" font-weight="bold">Nave Central</text>

  <!-- Arco ojival principal de la bóveda de crucería (punto de arranque en y=260) -->
  <!-- Ojiva izquierda y derecha que se intersectan en la clave superior (400, 160) -->
  <path d="M 365 260 A 80 80 0 0 1 400 160 A 80 80 0 0 1 435 260" fill="none" stroke="#5c4e3e" stroke-width="8"/>
  <circle cx="400" cy="160" r="7" fill="#8b5a2b"/>
  <text x="400" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5a10">Clave de bóveda</text>

  <!-- Ventanal alto del claristorio (Triforio / Vidrieras) -->
  <path d="M 375 260 L 375 200 A 25 25 0 0 1 425 200 L 425 260 Z" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" opacity="0.7"/>

  <!-- NAVES LATERALES (Aisles) -->
  <!-- Muros exteriores y pilares exteriores de contrafuerte -->
  <rect x="180" y="320" width="35" height="200" class="gc-stone"/>
  <rect x="585" y="320" width="35" height="200" class="gc-stone"/>

  <!-- Bóvedas de las naves laterales -->
  <path d="M 215 380 Q 280 340 340 380" fill="none" stroke="#5c4e3e" stroke-width="5"/>
  <path d="M 460 380 Q 520 340 585 380" fill="none" stroke="#5c4e3e" stroke-width="5"/>

  <!-- ARBOTANTES EXTERIORES (Flying Buttresses) -->
  <!-- Lado izquierdo (Arbotante superior e inferior) -->
  <path d="M 340 230 Q 270 240 215 320" fill="none" stroke="#5c4e3e" stroke-width="10"/>
  <path d="M 340 270 Q 280 290 215 350" fill="none" stroke="#5c4e3e" stroke-width="6"/>
  <text x="270" y="225" text-anchor="middle" class="gc-text" font-weight="bold" fill="#7a5a10">Arbotante</text>

  <!-- Lado derecho -->
  <path d="M 460 230 Q 530 240 585 320" fill="none" stroke="#5c4e3e" stroke-width="10"/>
  <path d="M 460 270 Q 520 290 585 350" fill="none" stroke="#5c4e3e" stroke-width="6"/>
  <text x="530" y="225" text-anchor="middle" class="gc-text" font-weight="bold" fill="#7a5a10">Arbotante</text>

  <!-- PINÁCULOS SUPERIORES (Aportan carga gravitatoria vertical para desviar el vector resultante) -->
  <polygon points="180,320 197,240 215,320" fill="#756752" stroke="#422812" stroke-width="2"/>
  <polygon points="585,320 602,240 620,320" fill="#756752" stroke="#422812" stroke-width="2"/>
  <text x="197" y="230" text-anchor="middle" font-size="11" class="gc-text">Pináculo</text>
  <text x="602" y="230" text-anchor="middle" font-size="11" class="gc-text">Pináculo</text>

  <!-- LÍNEAS DE EMPUJE ESTÁTICO (Thrust Lines de la bóveda) -->
  <!-- Vector empuje bóveda hacia arbotante -->
  <path d="M 400 160 Q 360 200 215 340 L 197 520" class="gc-thrust"/>
  <path d="M 400 160 Q 440 200 585 340 L 602 520" class="gc-thrust"/>

  <!-- Flechas vectoriales de fuerza -->
  <polygon points="310,232 300,240 312,244" class="gc-arrow"/>
  <polygon points="490,232 500,240 488,244" class="gc-arrow"/>
  <polygon points="197,515 192,498 202,498" class="gc-arrow"/>
  <polygon points="602,515 597,498 607,498" class="gc-arrow"/>

  <!-- Panel didáctico de estática gráfica -->
  <rect x="40" y="100" width="220" height="95" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="125" class="gc-text" font-weight="bold">Resolución de Fuerzas:</text>
  <text x="50" y="145" class="gc-text">• Empuje lateral del arco ojival</text>
  <text x="50" y="165" class="gc-text">• Desvío por arbotante aéreo</text>
  <text x="50" y="182" class="gc-text">• Peso del pináculo verticaliza la carga</text>
</svg>
