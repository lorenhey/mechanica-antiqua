<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pm-bg { fill: #fcf9f2; }
      .pm-wood { fill: #8b5a2b; stroke: #5c3a1e; stroke-width: 2.5; }
      .pm-iron { fill: #444; stroke: #222; stroke-width: 2; }
      .pm-water { fill: #4a90e2; fill-opacity: 0.65; }
      .pm-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .pm-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
      
      @keyframes anim-camshaft-rot {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes anim-hammer-1 {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-22deg); }
        42% { transform: rotate(0deg); }
      }
      @keyframes anim-hammer-2 {
        0%, 30% { transform: rotate(0deg); }
        65% { transform: rotate(-22deg); }
        72% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes anim-hammer-3 {
        0%, 60% { transform: rotate(0deg); }
        92% { transform: rotate(-22deg); }
        98% { transform: rotate(0deg); }
        100% { transform: rotate(0deg); }
      }
      
      .camshaft-spin {
        transform-origin: 300px 300px;
        animation: anim-camshaft-rot 3s linear infinite;
      }
      .hammer-swing-1 {
        transform-origin: 480px 360px;
        animation: anim-hammer-1 3s ease-in-out infinite;
      }
      .hammer-swing-2 {
        transform-origin: 540px 360px;
        animation: anim-hammer-2 3s ease-in-out infinite;
      }
      .hammer-swing-3 {
        transform-origin: 600px 360px;
        animation: anim-hammer-3 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="800" height="600" class="pm-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="pm-title">Molino Papelero de Mazos Batidores (Cartiera)</text>
  <text x="400" y="70" text-anchor="middle" class="pm-text">Vittorio Zonca (1607) - Desfibrado rítmico de trapos en cubas de agua para pasta de papel</text>

  <!-- Cubas de piedra inferiores con agua y trapos -->
  <rect x="420" y="450" width="240" height="90" fill="#a89a84" stroke="#5c4e3a" stroke-width="4"/>
  <rect x="425" y="470" width="230" height="50" class="pm-water"/>
  <text x="540" y="500" text-anchor="middle" fill="#fff" font-weight="bold" font-family="'Cinzel', serif">Pila de Trapos y Agua</text>

  <!-- Árbol de levas rotatorio horizontal impulsado por rueda de agua -->
  <rect x="180" y="292" width="280" height="16" class="pm-wood"/>
  <g class="camshaft-spin">
    <circle cx="300" cy="300" r="40" class="pm-wood"/>
    <circle cx="300" cy="300" r="10" class="pm-iron"/>
    <!-- Levas de madera salientes a 120° -->
    <path d="M 300 260 L 330 250 L 320 270 Z" fill="#c59b27"/>
    <path d="M 335 320 L 350 350 L 330 340 Z" fill="#c59b27"/>
    <path d="M 265 320 L 250 350 L 270 340 Z" fill="#c59b27"/>
  </g>

  <!-- MAZO 1 (Animado oscilante) -->
  <g class="hammer-swing-1">
    <!-- Brazo oscilante de madera del mazo -->
    <polygon points="350,305 480,355 480,365 350,315" class="pm-wood"/>
    <circle cx="480" cy="360" r="6" fill="#333"/>
    <!-- Cabeza pesada del mazo de madera con clavos de hierro -->
    <rect x="430" y="400" width="40" height="60" class="pm-wood"/>
    <line x1="430" y1="460" x2="470" y2="460" stroke="#222" stroke-width="4"/>
  </g>

  <!-- MAZO 2 (Animado desfasado) -->
  <g class="hammer-swing-2">
    <polygon points="410,305 540,355 540,365 410,315" class="pm-wood"/>
    <circle cx="540" cy="360" r="6" fill="#333"/>
    <rect x="510" y="400" width="40" height="60" class="pm-wood"/>
    <line x1="510" y1="460" x2="550" y2="460" stroke="#222" stroke-width="4"/>
  </g>

  <!-- MAZO 3 (Animado desfasado) -->
  <g class="hammer-swing-3">
    <polygon points="470,305 600,355 600,365 470,315" class="pm-wood"/>
    <circle cx="600" cy="360" r="6" fill="#333"/>
    <rect x="590" y="400" width="40" height="60" class="pm-wood"/>
    <line x1="590" y1="460" x2="630" y2="460" stroke="#222" stroke-width="4"/>
  </g>

  <!-- Panel histórico -->
  <rect x="40" y="140" width="220" height="95" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="165" class="pm-text" font-weight="bold">Proceso de Desfibrado:</text>
  <text x="50" y="185" class="pm-text">• Mazos pesados machacan trapos</text>
  <text x="50" y="205" class="pm-text">• Agua constante para disolución</text>
  <text x="50" y="222" class="pm-text">• Pulpa homogénea para pliegos</text>
</svg>
