<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ck-bg { fill: #fcf9f2; }
      .ck-wood { fill: #8b5a2b; stroke: #5c3a1e; stroke-width: 2.5; }
      .ck-cord { stroke: #222; stroke-width: 2; fill: none; }
      .ck-thread { stroke: #fff; stroke-width: 2.5; fill: none; }
      .ck-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .ck-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
      
      @keyframes anim-wheel-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes anim-spindle-fast {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .bigwheel-turn {
        transform-origin: 300px 300px;
        animation: anim-wheel-slow 4s linear infinite;
      }
      .spindle-whirl {
        transform-origin: 640px 370px;
        animation: anim-spindle-fast 0.133s linear infinite;
      }
    </style>
  </defs>

  <rect width="800" height="600" class="ck-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="ck-title">Rueca de Hilar Tradicional India (Charkha)</text>
  <text x="400" y="70" text-anchor="middle" class="ck-text">Transmisión por lazo continuo con relación de multiplicación cinemática 1:30</text>

  <!-- Bancada horizontal de madera sobre el suelo -->
  <rect x="120" y="440" width="580" height="30" class="ck-wood"/>
  <rect x="270" y="320" width="30" height="120" class="ck-wood"/>
  <rect x="625" y="370" width="30" height="70" class="ck-wood"/>

  <!-- GRAN RUEDA MOTRIZ DE MADERA (Diámetro 240, animada suave a 60 RPM) -->
  <g class="bigwheel-turn">
    <circle cx="300" cy="300" r="120" fill="none" stroke="#8b5a2b" stroke-width="12"/>
    <circle cx="300" cy="300" r="120" fill="none" stroke="#5c3a1e" stroke-width="2"/>
    <circle cx="300" cy="300" r="24" class="ck-wood"/>
    <!-- 8 Rayos entrelazados característicos de la Charkha -->
    <line x1="300" y1="180" x2="300" y2="420" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="180" y1="300" x2="420" y2="300" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="215" y1="215" x2="385" y2="385" stroke="#5c3a1e" stroke-width="5"/>
    <line x1="215" y1="385" x2="385" y2="215" stroke="#5c3a1e" stroke-width="5"/>
    <!-- Manivela motriz manual -->
    <circle cx="240" cy="240" r="9" fill="#c59b27" stroke="#222" stroke-width="2"/>
  </g>
  <text x="300" y="465" text-anchor="middle" class="ck-text">Rueda motriz (D₁ = 60 cm)</text>

  <!-- Cuerda de transmisión sin fin en tensión -->
  <line x1="300" y1="180" x2="640" y2="362" class="ck-cord"/>
  <line x1="300" y1="420" x2="640" y2="378" class="ck-cord"/>

  <!-- HUSO METÁLICO HORIZONTAL (D₂ = 2 cm, animado ultra-rápido a 1800 RPM) -->
  <g class="spindle-whirl">
    <circle cx="640" cy="370" r="12" fill="#c59b27" stroke="#333" stroke-width="2"/>
    <line x1="640" y1="358" x2="640" y2="382" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Punta fina del huso con cono de hilo formado -->
  <line x1="620" y1="370" x2="720" y2="370" stroke="#444" stroke-width="4"/>
  <polygon points="650,364 690,367 690,373 650,376" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="415" class="ck-text" font-weight="bold">Huso (D₂ = 2 cm)</text>

  <!-- Hebra de algodón hilándose hacia la mano de la hilandera -->
  <line x1="720" y1="370" x2="760" y2="320" class="ck-thread"/>
  <circle cx="760" cy="320" r="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="760" y="300" text-anchor="middle" font-size="11" class="ck-text">Copos de algodón</text>

  <!-- Panel cinemático -->
  <rect x="40" y="100" width="220" height="90" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="125" class="ck-text" font-weight="bold">Multiplicación de Giro:</text>
  <text x="50" y="145" class="ck-text">• Relación i = D₁ / D₂ = 30:1</text>
  <text x="50" y="165" class="ck-text">• Entrada manual: 60 RPM</text>
  <text x="50" y="182" class="ck-text">• Giro del huso: 1800 RPM</text>
</svg>
