description: Instrumento balístico que actúa como extensión del brazo humano mediante una palanca de tercer género. Almacena energía elástica en la flexión del dardo e incrementa el radio angular de aceleración, transmitiendo una velocidad de salida y penetración muy superiores a las del tiro manual directo.
