description: "A water-raising machine featuring an early use of a true crank and a slot-rod mechanism. A paddle wheel turned by a stream drives a horizontal gear wheel, which has a peg moving in a slotted rod. The rod pulls and pushes two opposed pistons in copper cylinders, drawing water through flap valves and pumping it up to a higher elevation."
