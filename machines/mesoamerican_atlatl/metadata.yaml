description: >
  The atlatl is a tool that uses leverage to achieve greater velocity in dart-throwing, 
  and includes a bearing surface which allows the user to store energy during the throw. 
  It acts as an extension of the human arm (a third-class lever) and transfers elastic 
  potential energy as the dart flexes and rebounds.
