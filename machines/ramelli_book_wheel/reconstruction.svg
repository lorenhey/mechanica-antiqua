<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .rw-bg { fill: #fcf9f2; }
      .rw-wood { fill: #8b5a2b; stroke: #5c3a1e; stroke-width: 2.5; }
      .rw-book { fill: #fff; stroke: #8b0000; stroke-width: 2; }
      .rw-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .rw-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
      
      @keyframes anim-wheel-cw {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes anim-desk-counter {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      
      .drum-rotate {
        transform-origin: 400px 320px;
        animation: anim-wheel-cw 12s linear infinite;
      }
      .desk-level {
        transform-origin: 0px 0px;
        animation: anim-desk-counter 12s linear infinite;
      }
    </style>
  </defs>

  <rect width="800" height="600" class="rw-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="rw-title">Rueda de Lectura de Ramelli (Ruota dei Libri)</text>
  <text x="400" y="70" text-anchor="middle" class="rw-text">Agostino Ramelli (1588) - Tren epicicloidal que mantiene los atriles estrictamente horizontales</text>

  <!-- Estructura exterior fija de la cabina de lectura -->
  <path d="M 160 520 L 220 200 L 580 200 L 640 520" fill="none" stroke="#5c3a1e" stroke-width="8"/>
  <circle cx="400" cy="320" r="25" fill="#333"/>
  <text x="400" y="325" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Sol Fijo</text>

  <!-- TAMBOR PRINCIPAL GIRATORIO (Animado en sentido horario) -->
  <g class="drum-rotate">
    <circle cx="400" cy="320" r="170" fill="none" stroke="#8b5a2b" stroke-width="12"/>
    <circle cx="400" cy="320" r="170" fill="none" stroke="#5c3a1e" stroke-width="2"/>
    
    <!-- 8 Rayos del tambor -->
    <line x1="400" y1="150" x2="400" y2="490" stroke="#5c3a1e" stroke-width="4"/>
    <line x1="230" y1="320" x2="570" y2="320" stroke="#5c3a1e" stroke-width="4"/>
    <line x1="280" y1="200" x2="520" y2="440" stroke="#5c3a1e" stroke-width="4"/>
    <line x1="280" y1="440" x2="520" y2="200" stroke="#5c3a1e" stroke-width="4"/>

    <!-- 8 ATRILES PLANETARIOS EPICICLOIDALES (Compensados para mantenerse horizontales) -->
    <!-- Atril 1 (Arriba: 400, 150) -->
    <g transform="translate(400, 150)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <!-- Libro abierto -->
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>

    <!-- Atril 2 (Arriba-Der: 520, 200) -->
    <g transform="translate(520, 200)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>

    <!-- Atril 3 (Derecha: 570, 320) -->
    <g transform="translate(570, 320)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>

    <!-- Atril 4 (Abajo-Der: 520, 440) -->
    <g transform="translate(520, 440)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>

    <!-- Atril 5 (Abajo: 400, 490) -->
    <g transform="translate(400, 490)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>

    <!-- Atril 6 (Abajo-Izq: 280, 440) -->
    <g transform="translate(280, 440)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>

    <!-- Atril 7 (Izquierda: 230, 320) -->
    <g transform="translate(230, 320)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>

    <!-- Atril 8 (Arriba-Izq: 280, 200) -->
    <g transform="translate(280, 200)">
      <g class="desk-level">
        <circle cx="0" cy="0" r="14" fill="#c59b27" stroke="#222" stroke-width="1.5"/>
        <rect x="-35" y="-6" width="70" height="12" class="rw-wood"/>
        <polygon points="-30,-6 0,-18 30,-6 0,-12" class="rw-book"/>
      </g>
    </g>
  </g>

  <!-- Panel cinemático epicicloidal -->
  <rect x="40" y="100" width="220" height="95" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="125" class="rw-text" font-weight="bold">Tren Epicicloidal i = -1:</text>
  <text x="50" y="145" class="rw-text">• Engranajes satélites compensan</text>
  <text x="50" y="165" class="rw-text">  exactamente la rotación del tambor.</text>
  <text x="50" y="182" class="rw-text">• Los libros no caen jamás.</text>
</svg>
