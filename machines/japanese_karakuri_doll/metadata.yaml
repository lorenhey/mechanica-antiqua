description: Autómata mecánico del período Edo accionado por un muelle espiral de
  ballena. Avanza paso a paso portando una taza de té; cuando el comensal retira la
  taza, un balancín detiene el escape del mecanismo; al volver a colocar la taza vacía,
  el autómata gira 180 grados sobre su eje y regresa a la posición de partida.
