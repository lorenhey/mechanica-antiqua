<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .as-bg { fill: #fcf9f2; }
      .as-wood { fill: #8b5a2b; stroke: #5c3a1e; stroke-width: 2.5; }
      .as-water { fill: #4a90e2; fill-opacity: 0.7; }
      .as-casing { fill: #fff; fill-opacity: 0.25; stroke: #5c3a1e; stroke-width: 4; }
      .as-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .as-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
      
      @keyframes anim-helix-turn {
        0% { transform: translateY(0); }
        100% { transform: translateY(-56px); }
      }
      @keyframes anim-water-packets {
        0% { transform: translate(0, 0); }
        100% { transform: translate(45px, -34px); }
      }
      @keyframes anim-flow-stream {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -20; }
      }
      
      .helix-move {
        animation: anim-water-packets 1.6s linear infinite;
      }
      .water-flow {
        stroke-dasharray: 6 4;
        animation: anim-flow-stream 0.8s linear infinite;
      }
    </style>
  </defs>

  <rect width="800" height="600" class="as-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="as-title">Tornillo de Arquímedes (Cochlea Vitruviana)</text>
  <text x="400" y="70" text-anchor="middle" class="as-text">Vitruvio, De Architectura (Libro X) - Pendiente pitagórica 3:4:5 (~37°)</text>

  <!-- Estanque de agua inferior -->
  <rect x="40" y="460" width="320" height="120" class="as-water"/>
  <text x="140" y="530" fill="#fff" font-family="'Cinzel', serif" font-weight="bold">Estanque Inferior</text>

  <!-- Canal receptor superior -->
  <rect x="560" y="160" width="200" height="30" class="as-wood"/>
  <rect x="560" y="150" width="200" height="20" class="as-water"/>
  <path d="M 660 170 L 760 170" fill="none" stroke="#2563eb" stroke-width="4" class="water-flow"/>
  <text x="660" y="140" text-anchor="middle" class="as-text" font-weight="bold">Canal Superior de Riego</text>

  <!-- ESTRUCTURA INCLINADA A 37 GRADOS -->
  <!-- Grupo rotado a ~37° alrededor del pivote inferior -->
  <g transform="translate(180, 500) rotate(-37)">
    <!-- Cilindro exterior transparente (Carcasa de tablillas de madera con pez) -->
    <rect x="0" y="-55" width="540" height="110" class="as-casing" rx="10"/>
    
    <!-- Eje central de madera -->
    <rect x="-30" y="-12" width="600" height="24" class="as-wood"/>
    
    <!-- Espiras helicoidales móviles (simuladas por desplazamiento continuo sincronizado) -->
    <g class="helix-move">
      <!-- Espiras de hélice (filetes de tablillas) -->
      <path d="M 30 -50 Q 55 0 80 50 Q 105 0 130 -50" fill="none" stroke="#5c3a1e" stroke-width="8"/>
      <path d="M 120 -50 Q 145 0 170 50 Q 195 0 220 -50" fill="none" stroke="#5c3a1e" stroke-width="8"/>
      <path d="M 210 -50 Q 235 0 260 50 Q 285 0 310 -50" fill="none" stroke="#5c3a1e" stroke-width="8"/>
      <path d="M 300 -50 Q 325 0 350 50 Q 375 0 400 -50" fill="none" stroke="#5c3a1e" stroke-width="8"/>
      <path d="M 390 -50 Q 415 0 440 50 Q 465 0 490 -50" fill="none" stroke="#5c3a1e" stroke-width="8"/>
      <path d="M 480 -50 Q 505 0 530 50 Q 555 0 580 -50" fill="none" stroke="#5c3a1e" stroke-width="8"/>
      
      <!-- Paquetes de agua atrapados en la concavidad inferior de cada espira -->
      <ellipse cx="70" cy="28" rx="24" ry="12" class="as-water"/>
      <ellipse cx="160" cy="28" rx="24" ry="12" class="as-water"/>
      <ellipse cx="250" cy="28" rx="24" ry="12" class="as-water"/>
      <ellipse cx="340" cy="28" rx="24" ry="12" class="as-water"/>
      <ellipse cx="430" cy="28" rx="24" ry="12" class="as-water"/>
      <ellipse cx="520" cy="28" rx="24" ry="12" class="as-water"/>
    </g>

    <!-- Manivela o rueda de pisar en el extremo superior -->
    <circle cx="560" cy="0" r="30" class="as-wood"/>
    <rect x="555" y="-60" width="10" height="120" fill="#333"/>
  </g>

  <!-- Pivotes de apoyo -->
  <polygon points="170,490 190,490 200,540 160,540" fill="#444"/>
  <polygon points="600,180 620,180 630,240 590,240" fill="#444"/>

  <!-- Panel geométrico según Vitruvio -->
  <rect x="40" y="270" width="280" height="100" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="295" class="as-text" font-weight="bold">Regla Proporcional Vitruviana:</text>
  <text x="50" y="315" class="as-text">• Longitud L dividida en 8 partes</text>
  <text x="50" y="335" class="as-text">• Paso de hélice = Diámetro exterior</text>
  <text x="50" y="355" class="as-text">• Triángulo 3-4-5: Inclinación θ ≈ 36,87°</text>
</svg>
