<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-at" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    </pattern>
    <pattern id="grid-at-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid-at)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>
    </pattern>
    <marker id="arr-at" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="#059669"/>
    </marker>
    <style>
      .at-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .at-sub { font-family: 'Consolas', monospace; font-size: 12px; fill: #475569; }
      .at-node { font-family: 'Consolas', monospace; font-size: 12px; font-weight: bold; fill: #b91c1c; }
    </style>
  </defs>
  <rect width="800" height="560" fill="#fcfbf7"/>
  <rect width="800" height="560" fill="url(#grid-at-major)"/>
  <text x="400" y="36" text-anchor="middle" class="at-title">ÁTLATL — CADENA BIOMECÁNICA Y BALÍSTICA ELÁSTICA</text>
  <text x="400" y="54" text-anchor="middle" class="at-sub">Palanca de 3er Género (O₁-E-W-H) + Pandeo Euler-Bernoulli + Tiro Parabólico</text>

  <!-- Eje de suelo ISO -->
  <line x1="60" y1="480" x2="740" y2="480" stroke="#dc2626" stroke-width="1" stroke-dasharray="14 4 3 4"/>

  <!-- Cadena cinemática articulada -->
  <line x1="160" y1="365" x2="220" y2="305" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <line x1="220" y1="305" x2="285" y2="270" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <line x1="285" y1="270" x2="365" y2="205" stroke="#854d0e" stroke-width="8" stroke-linecap="round"/>

  <!-- Dardo flexionado y trayectoria parabólica -->
  <path d="M 365 205 Q 440 165 510 155" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <path d="M 365 205 Q 540 105 730 295" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="365" y1="205" x2="430" y2="165" stroke="#059669" stroke-width="2.5" marker-end="url(#arr-at)"/>

  <!-- Nodos cinemáticos -->
  <circle cx="160" cy="365" r="7" fill="#d97706" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="220" cy="305" r="6" fill="#d97706" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="285" cy="270" r="6" fill="#d97706" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="365" cy="205" r="5" fill="#d97706" stroke="#1e293b" stroke-width="1.5"/>
  <text x="145" y="385" class="at-node">O₁ (Hombro)</text>
  <text x="230" y="318" class="at-node">E (Codo)</text>
  <text x="295" y="285" class="at-node">W (Muñeca)</text>
  <text x="375" y="220" class="at-node">H (Gancho)</text>
</svg>
