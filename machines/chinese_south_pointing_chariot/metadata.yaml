description: Vehículo mecánico no magnético que mantiene una figura apuntando permanentemente hacia la misma dirección cardinal inicial (el sur). Su funcionamiento se basa en un mecanismo de engranajes diferenciales acoplado a las dos ruedas independientes, compensando con exactitud cinemática cualquier rotación angular del chasis.
