<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sp-bg { fill: #fcf9f2; }
      .sp-wood { fill: #8b5a2b; stroke: #5c3a1e; stroke-width: 2.5; }
      .sp-metal { fill: #708090; stroke: #333; stroke-width: 2; }
      .sp-water { fill: #4a90e2; fill-opacity: 0.7; }
      .sp-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #3d2b1f; }
      .sp-text { font-family: 'EB Garamond', serif; font-size: 14px; fill: #333; }
      
      @keyframes anim-crank-turn {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes anim-piston-reciprocate {
        0%, 100% { transform: translateY(-35px); }
        50% { transform: translateY(35px); }
      }
      @keyframes anim-valve-lower {
        0%, 100% { transform: rotate(0deg); }
        40%, 60% { transform: rotate(-30deg); }
      }
      @keyframes anim-water-surge {
        0%, 100% { height: 110px; }
        50% { height: 170px; }
      }
      
      .crank-rotate {
        transform-origin: 320px 140px;
        animation: anim-crank-turn 3s linear infinite;
      }
      .piston-group {
        animation: anim-piston-reciprocate 3s ease-in-out infinite;
      }
      .valve-flap {
        transform-origin: 430px 480px;
        animation: anim-valve-lower 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="800" height="600" class="sp-bg"/>
  
  <text x="400" y="45" text-anchor="middle" class="sp-title">Bomba Aspirante de Pistón y Cigüeñal</text>
  <text x="400" y="70" text-anchor="middle" class="sp-text">Conversión de rotación continua a traslación lineal alternativa (Agricola, 1556)</text>

  <!-- Depósito inferior de agua de mina -->
  <rect x="360" y="480" width="160" height="120" class="sp-water"/>
  <rect x="320" y="480" width="40" height="120" fill="#a08260"/>
  <rect x="520" y="480" width="40" height="120" fill="#a08260"/>

  <!-- Cilindro de bomba de madera / bronce seccionado -->
  <rect x="400" y="240" width="80" height="250" fill="none" stroke="#5c3a1e" stroke-width="8"/>
  <rect x="404" y="240" width="72" height="250" fill="#fff" opacity="0.6"/>
  <!-- Agua dentro del cilindro -->
  <rect x="404" y="320" width="72" height="170" class="sp-water"/>

  <!-- Descarga lateral de agua -->
  <polygon points="480,260 580,280 580,310 480,300" class="sp-wood"/>
  <path d="M 580 295 Q 610 320 620 400" fill="none" stroke="#4a90e2" stroke-width="6"/>
  <text x="610" y="280" class="sp-text">Descarga de agua</text>

  <!-- Cigüeñal superior rotatorio -->
  <circle cx="320" cy="140" r="50" fill="none" stroke="#8b5a2b" stroke-width="8"/>
  <circle cx="320" cy="140" r="10" class="sp-metal"/>
  
  <g class="crank-rotate">
    <line x1="320" y1="140" x2="360" y2="105" stroke="#333" stroke-width="10"/>
    <circle cx="360" cy="105" r="8" fill="#c59b27" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Biela y Grupo Pistón alternativo -->
  <g class="piston-group">
    <!-- Vástago vertical rígido -->
    <rect x="436" y="160" width="8" height="160" class="sp-metal"/>
    
    <!-- Pistón con guarnición de cuero -->
    <rect x="404" y="310" width="72" height="22" class="sp-metal"/>
    <rect x="404" y="314" width="72" height="14" fill="#a0522d"/>
    
    <!-- Válvula del pistón (válvula superior de clapeta) -->
    <circle cx="440" cy="321" r="5" fill="#c59b27"/>
  </g>

  <!-- Biela oblicua que une el codo del cigüeñal con el vástago -->
  <line x1="360" y1="140" x2="440" y2="180" stroke="#5c3a1e" stroke-width="6"/>

  <!-- Válvula de pie (retención inferior) -->
  <g class="valve-flap">
    <line x1="430" y1="480" x2="465" y2="480" stroke="#8b5a2b" stroke-width="5"/>
  </g>
  <circle cx="430" cy="480" r="4" fill="#333"/>
  <text x="320" y="475" class="sp-text">Válvula de retención</text>

  <!-- Panel cinemático -->
  <rect x="40" y="240" width="240" height="95" fill="#fff" stroke="#d3c9b3" rx="4"/>
  <text x="50" y="265" class="sp-text" font-weight="bold">Cinemática del Mecanismo:</text>
  <text x="50" y="285" class="sp-text">• Carrera s = 2 · r_cigüeñal = 70 mm</text>
  <text x="50" y="305" class="sp-text">• Carrera ascendente: Succión (vacío)</text>
  <text x="50" y="325" class="sp-text">• Carrera descendente: Expulsión</text>
</svg>
