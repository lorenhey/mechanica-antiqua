<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" id="svg-martini-sawmill">
  <defs>
    <!-- Patrón de cuadrícula milimétrica de ingeniería -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8e2d5" stroke-width="0.75" />
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#grid)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d5cbba" stroke-width="1.2" />
    </pattern>

    <!-- Marcadores de flecha para cotas de ingeniería -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 0 5 L 10 8.5 Z" fill="#64748b" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 Z" fill="#64748b" />
    </marker>

    <!-- Estilos técnicos de ingeniería -->
    <style>
      .eng-bg { fill: #fcfbf7; }
      .eng-title { font-family: 'Cinzel', serif; font-size: 20px; font-weight: bold; fill: #2b1f14; }
      .eng-subtitle { font-family: 'EB Garamond', serif; font-size: 14px; fill: #4a3525; }
      .eng-wood { fill: #9a6538; stroke: #5c3a1e; stroke-width: 2; }
      .eng-iron { fill: #475569; stroke: #1e293b; stroke-width: 2; }
      .eng-steel { fill: #94a3b8; stroke: #334155; stroke-width: 1.5; }
      .eng-brass { fill: #d97706; stroke: #78350f; stroke-width: 1.5; }
      .eng-dim { stroke: #64748b; stroke-width: 1.2; fill: none; }
      .eng-dim-text { font-family: 'EB Garamond', serif; font-size: 12px; fill: #475569; font-weight: 600; text-anchor: middle; }
      .eng-centerline { stroke: #dc2626; stroke-width: 1; stroke-dasharray: 14 3 3 3; }
      .eng-node { font-family: 'EB Garamond', serif; font-size: 14px; font-weight: bold; fill: #b91c1c; }
      .eng-ground { stroke: #1e293b; stroke-width: 2; }
      .eng-hatch { stroke: #64748b; stroke-width: 1; }
    </style>
  </defs>

  <!-- Fondo técnico con cuadrícula milimetrada -->
  <rect width="800" height="600" class="eng-bg"/>
  <rect width="800" height="600" fill="url(#major-grid)"/>

  <!-- Encabezado técnico del plano -->
  <text x="400" y="38" text-anchor="middle" class="eng-title">Aserradero Hidráulico con Biela-Manivela</text>
  <text x="400" y="58" text-anchor="middle" class="eng-subtitle">Francesco di Giorgio Martini (Trattato di architettura, c. 1480) — Reconstrucción Cinemática Analítica</text>
  <line x1="120" y1="68" x2="680" y2="68" stroke="#d3c9b3" stroke-width="1.2"/>

  <!-- Líneas de eje y centros (Centerlines ISO) -->
  <line x1="40" y1="420" x2="360" y2="420" class="eng-centerline"/>
  <line x1="220" y1="280" x2="220" y2="550" class="eng-centerline"/>
  <line x1="480" y1="80" x2="480" y2="550" class="eng-centerline"/>

  <!-- BANCADA Y ESTRUCTURA FIJA (Eslabón 1: Tierra) -->
  <!-- Muro de mampostería y canal inferior -->
  <rect x="20" y="510" width="300" height="80" fill="#e2d9cc" stroke="#8c7e6c" stroke-width="2"/>
  <text x="170" y="555" fill="#6b5b47" font-family="'Cinzel', serif" font-size="12" text-anchor="middle">Canal Hidráulico Fluvial</text>
  <path d="M 20 525 Q 160 515 300 525" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="8 4"/>

  <!-- Soporte del cojinete O2 con símbolo de bancada fija -->
  <rect x="205" y="420" width="30" height="90" class="eng-iron"/>
  <!-- Achurado de tierra en apoyo O2 -->
  <line x1="190" y1="510" x2="250" y2="510" class="eng-ground"/>
  <line x1="195" y1="510" x2="185" y2="522" class="eng-hatch"/>
  <line x1="210" y1="510" x2="200" y2="522" class="eng-hatch"/>
  <line x1="225" y1="510" x2="215" y2="522" class="eng-hatch"/>
  <line x1="240" y1="510" x2="230" y2="522" class="eng-hatch"/>

  <!-- Columna y guías verticales de la corredera de la sierra -->
  <rect x="420" y="110" width="18" height="420" class="eng-wood"/>
  <rect x="522" y="110" width="18" height="420" class="eng-wood"/>
  <rect x="420" y="100" width="120" height="18" class="eng-wood"/>
  <rect x="420" y="510" width="120" height="20" class="eng-wood"/>
  <!-- Achurado de fijación del bastidor -->
  <line x1="410" y1="530" x2="550" y2="530" class="eng-ground"/>
  <line x1="420" y1="530" x2="410" y2="542" class="eng-hatch"/>
  <line x1="445" y1="530" x2="435" y2="542" class="eng-hatch"/>
  <line x1="470" y1="530" x2="460" y2="542" class="eng-hatch"/>
  <line x1="495" y1="530" x2="485" y2="542" class="eng-hatch"/>
  <line x1="520" y1="530" x2="510" y2="542" class="eng-hatch"/>
  <line x1="545" y1="530" x2="535" y2="542" class="eng-hatch"/>

  <!-- RUEDA HIDRÁULICA Y MANIVELA (Eslabón 2: Motriz) -->
  <g id="crank-group" class="crank-rot">
    <!-- Corona de la rueda motriz de paletas -->
    <circle cx="220" cy="420" r="105" fill="none" stroke="#78350f" stroke-width="14"/>
    <circle cx="220" cy="420" r="112" fill="none" stroke="#3d2b1f" stroke-width="1.5"/>
    <circle cx="220" cy="420" r="98" fill="none" stroke="#3d2b1f" stroke-width="1.5"/>
    
    <!-- 8 Paletas de madera maciza -->
    <line x1="220" y1="315" x2="220" y2="525" stroke="#5c3a1e" stroke-width="6"/>
    <line x1="115" y1="420" x2="325" y2="420" stroke="#5c3a1e" stroke-width="6"/>
    <line x1="146" y1="346" x2="294" y2="494" stroke="#5c3a1e" stroke-width="6"/>
    <line x1="146" y1="494" x2="294" y2="346" stroke="#5c3a1e" stroke-width="6"/>

    <!-- Brazo de la manivela de hierro forjado -->
    <path d="M 220 420 L 265 385" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    <circle cx="220" cy="420" r="22" class="eng-iron"/>
    <circle cx="220" cy="420" r="8" fill="#cbd5e1"/>

    <!-- Muñón del cigüeñal (Nodo A) -->
    <circle id="crank-pin" cx="265" cy="385" r="10" class="eng-brass"/>
    <circle cx="265" cy="385" r="3.5" fill="#1e293b"/>
  </g>

  <!-- MARCO DE LA SIERRA / CURSOR (Eslabón 4: Seguidor) -->
  <g id="slider-group" class="saw-reciprocate">
    <!-- Bastidor deslizante de madera guiado en las ranuras verticales -->
    <rect x="438" y="195" width="84" height="210" fill="none" stroke="#78350f" stroke-width="7" rx="3"/>
    
    <!-- Hoja de sierra templada con dentado triscado -->
    <line x1="480" y1="195" x2="480" y2="405" class="eng-steel" stroke-width="7"/>
    <!-- Dentado de corte en la hoja -->
    <path d="M 480 220 L 488 227 L 480 234 M 480 244 L 488 251 L 480 258 M 480 268 L 488 275 L 480 282 M 480 292 L 488 299 L 480 306 M 480 316 L 488 323 L 480 330 M 480 340 L 488 347 L 480 354 M 480 364 L 488 371 L 480 378" stroke="#0f172a" stroke-width="2.5" fill="none"/>
    
    <!-- Travesaño inferior con orejetas de fijación para la biela (Nodo B) -->
    <rect x="466" y="395" width="28" height="20" class="eng-iron" rx="2"/>
    <circle id="wrist-pin" cx="480" cy="405" r="8" class="eng-brass"/>
    <circle cx="480" cy="405" r="3" fill="#1e293b"/>
  </g>

  <!-- BIELA ARTICULADA (Eslabón 3: Acoplador) -->
  <!-- Une el muñón de manivela A con el pasador B del marco de la sierra -->
  <g id="connecting-rod-group">
    <line id="connecting-rod" x1="265" y1="385" x2="480" y2="365" stroke="#92400e" stroke-width="8" stroke-linecap="round"/>
    <!-- Cabeza y pie de biela con bujes de bronce -->
    <circle cx="265" cy="385" r="13" fill="none" stroke="#78350f" stroke-width="2"/>
    <circle cx="480" cy="365" r="11" fill="none" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- MESA DE CORTE Y TRONCO CON AVANCE -->
  <!-- Carro porta-tronco con avance horizontal continuo -->
  <g class="log-forward">
    <rect x="500" y="340" width="260" height="22" class="eng-wood"/>
    <!-- Ruedas del carro sobre rieles -->
    <circle cx="540" cy="372" r="11" class="eng-iron"/>
    <circle cx="700" cy="372" r="11" class="eng-iron"/>
    <!-- Tronco cilíndrico en proceso de aserrado longitudinal -->
    <ellipse cx="490" cy="320" rx="16" ry="24" fill="#a07246" stroke="#5c3a1e" stroke-width="2"/>
    <rect x="490" y="296" width="240" height="48" fill="#d4a373" stroke="#5c3a1e" stroke-width="2"/>
    <!-- Corte longitudinal de la sierra en el tronco -->
    <line x1="480" y1="320" x2="560" y2="320" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="4 2"/>
  </g>
  <!-- Rieles guía de rodadura -->
  <line x1="470" y1="383" x2="780" y2="383" stroke="#334155" stroke-width="5"/>

  <!-- COTAS DIMENSIONALES NORMALIZADAS (ASME / ISO) -->
  <!-- Cota de Radio de Manivela r = 150 mm -->
  <line x1="220" y1="385" x2="265" y2="385" class="eng-dim" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <text x="242" y="375" class="eng-dim-text">r = 150</text>

  <!-- Cota de Carrera Total S = 300 mm -->
  <line x1="560" y1="250" x2="560" y2="350" class="eng-dim" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="540" y1="250" x2="570" y2="250" class="eng-dim"/>
  <line x1="540" y1="350" x2="570" y2="350" class="eng-dim"/>
  <text x="595" y="305" class="eng-dim-text">S = 300 mm</text>

  <!-- Cota de Longitud de Biela L = 750 mm -->
  <line x1="290" y1="470" x2="450" y2="470" class="eng-dim" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)"/>
  <line x1="290" y1="460" x2="290" y2="480" class="eng-dim"/>
  <line x1="450" y1="460" x2="450" y2="480" class="eng-dim"/>
  <text x="370" y="488" class="eng-dim-text">Biela L = 750 mm (λ = 0.20)</text>

  <!-- Rótulos de Nodos Cinemáticos (Pares R y P) -->
  <text x="200" y="415" class="eng-node">O₂</text>
  <text x="275" y="380" class="eng-node">A</text>
  <text x="500" y="405" class="eng-node">B</text>
  <text x="535" y="160" font-family="'EB Garamond', serif" font-size="12" fill="#475569" font-weight="bold">Par P (Guía)</text>

  <!-- Cuadro Técnico de Datos de Ingeniería -->
  <g transform="translate(40, 80)">
    <rect width="250" height="98" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" rx="4" opacity="0.95"/>
    <rect width="250" height="24" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="12" y="17" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#1e293b">Parámetros Cinemáticos</text>
    <text x="12" y="38" font-family="'EB Garamond', serif" font-size="12" fill="#334155">• Grados de libertad: F = 1 (Grübler)</text>
    <text x="12" y="55" font-family="'EB Garamond', serif" font-size="12" fill="#334155">• Carrera vertical: S = 2 · r = 300 mm</text>
    <text x="12" y="72" font-family="'EB Garamond', serif" font-size="12" fill="#334155">• Relación de biela: λ = r / L = 0.20</text>
    <text x="12" y="89" font-family="'EB Garamond', serif" font-size="12" fill="#334155">• Régimen nominal: n = 45 rpm (ω = 4.71 rad/s)</text>
  </g>
</svg>