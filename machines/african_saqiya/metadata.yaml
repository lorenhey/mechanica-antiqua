description: Rueda hidráulica accionada por tracción animal mediante un par de engranajes
  en ángulo recto (rueda de corona y piñón de linterna) que impulsa un rosario continuo
  de vasijas o cangilones. Utilizada ampliamente en Egipto, Nubia (Kush) y posteriormente
  en el mundo islámico para la elevación continua de agua para riego agrícola.
