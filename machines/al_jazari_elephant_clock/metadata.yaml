description: "An elaborate water clock shaped like an Asian elephant. It uses a sinking bowl with a calibrated orifice floating in a water tank hidden inside the elephant. As the bowl fills and sinks, it triggers strings and pulleys that release balls, strike a cymbal, and move automata (a scribe, an eagle, a mahout) to mark the passage of a half-hour."
